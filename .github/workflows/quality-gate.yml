name: quality-gate

on:
  push:
  pull_request:

# One run at a time so parallel jobs don't share the free-tier quota.
concurrency:
  group: quality-gate
  cancel-in-progress: false

jobs:
  deepeval:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - run: ruff check .

      # Core cases only (free tier: ~20 requests/day per model).
      # deepeval exits non-zero when any metric is below its threshold.
      # Switch models in Settings > Variables when a daily quota runs out;
      # empty values fall back to the defaults in the code.
      - name: Run core quality cases
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          JUDGE_MODEL: ${{ vars.JUDGE_MODEL }}
          DEEPEVAL_TELEMETRY_OPT_OUT: "YES"
        run: deepeval test run test_agent.py -m core
